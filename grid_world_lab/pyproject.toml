[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-world-lab"
version = "0.1.0"
description = "Standalone grid navigation transformer, activation probing, and map reconstruction experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24"]

[project.scripts]
gridworld = "gridworld.__main__:main"

[tool.setuptools.packages.find]
include = ["gridworld*"]
